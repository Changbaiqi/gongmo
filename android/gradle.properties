org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Disable Kotlin incremental compilation: plugin sources live on a different
# drive (pub cache on C:) than the project (D:), which makes the incremental
# cache fail with "different roots" and breaks the build (known Kotlin bug).
kotlin.incremental=false
# 关闭资源名混淆：通知小图标/提示音等按名字查找的资源（getIdentifier、
# android.resource://包名/raw/xxx）在混淆后会解析失败，导致通知发不出来
android.enableResourceOptimizations=false
